<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test DASH - Diagnóstico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background: #2d2d2d;
        }
        .success { border-left: 4px solid #4CAF50; }
        .error { border-left: 4px solid #f44336; }
        .info { border-left: 4px solid #2196F3; }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #log {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Diagnóstico de Conectividad DASH</h1>
    
    <div class="test-result info">
        <strong>Tu ubicación:</strong> <span id="location">Detectando...</span>
    </div>
    
    <div class="test-result info">
        <strong>URL Base:</strong> <span id="baseUrl">-</span>
    </div>

    <h2>Pruebas</h2>
    <button onclick="testAPI()">Test API Backend</button>
    <button onclick="testMPD()">Test MPD Existe</button>
    <button onclick="testSegmentos()">Test Directorio Segmentos</button>
    <button onclick="startStream()">Iniciar Transmisión</button>
    <button onclick="clearLog()">Limpiar Log</button>

    <h2>Log de Resultados</h2>
    <div id="log"></div>

    <script>
        const baseUrl = window.location.origin;
        
        document.getElementById('location').textContent = window.location.href;
        document.getElementById('baseUrl').textContent = baseUrl;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f44336' : type === 'success' ? '#4CAF50' : '#2196F3';
            logDiv.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function testAPI() {
            log('Probando conexión a API...', 'info');
            try {
                const response = await fetch(`${baseUrl}/api/stream/status`);
                const data = await response.json();
                log(`API OK: ${JSON.stringify(data)}`, 'success');
            } catch (error) {
                log(`Error en API: ${error.message}`, 'error');
            }
        }

        async function testMPD() {
            log('Probando acceso a MPD...', 'info');
            try {
                const response = await fetch(`${baseUrl}/segmentos/video0.mpd`, { method: 'HEAD' });
                if (response.ok) {
                    log(`MPD existe: ${response.status} ${response.statusText}`, 'success');
                    log(`Headers: ${JSON.stringify([...response.headers])}`, 'info');
                } else {
                    log(`MPD no encontrado: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`Error al acceder MPD: ${error.message}`, 'error');
            }
        }

        async function testSegmentos() {
            log('Probando acceso a directorio segmentos...', 'info');
            try {
                const response = await fetch(`${baseUrl}/segmentos/`);
                if (response.ok) {
                    log(`Directorio accesible: ${response.status}`, 'success');
                } else {
                    log(`Error: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function startStream() {
            log('Iniciando transmisión...', 'info');
            try {
                const response = await fetch(`${baseUrl}/api/stream/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                log(`Respuesta: ${JSON.stringify(data)}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    log('Esperando 5 segundos para que se generen segmentos...', 'info');
                    setTimeout(() => {
                        log('Ahora puedes probar "Test MPD Existe"', 'success');
                    }, 5000);
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        // Auto-test al cargar
        window.addEventListener('load', () => {
            log('Página cargada. Ejecutando tests automáticos...', 'info');
            setTimeout(testAPI, 500);
            setTimeout(testSegmentos, 1000);
        });
    </script>
</body>
</html>
